services:
  # PostgreSQL database
  database:
    image: postgres:18.6
    env_file:
      - .env
    ports:
      - "${DB_EXPOSED_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (Express)
  backend:
    build: ./server
    env_file:
      - .env
    ports:
      - "${BACKEND_EXPOSED_PORT}:${PORT}"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT}/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend (React/Vite)
  frontend:
    build: .
    env_file:
      - .env
    ports:
      - "${FRONTEND_EXPOSED_PORT}:${FRONTEND_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: